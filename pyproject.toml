[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wearable-anomaly-detection"
version = "0.1.0"
description = "Personalized wearable anomaly detection pipeline"
requires-python = "==3.12.*"
dependencies = [
    "fastapi[standard]==0.141.1",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "scikit-learn==1.9.0",
    "scipy==1.18.1",
    "joblib==1.6.0",
    "torch==2.14.0",
    "prometheus-client"
]

[tool.fastapi]
entrypoint = "api.main:app"

[tool.pytest.ini_options]
pythonpath = [
    "."
]
testpaths = [
    "tests"
]
